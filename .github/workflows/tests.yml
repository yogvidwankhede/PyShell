name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
      
      - name: Verify installation
        run: |
          python -c "import pyshell; print('✓ PyShell package imported successfully')"
          python -c "import pytest; print(f'✓ Pytest version: {pytest.__version__}')"
          python -c "import rich; print('✓ Rich imported')"
          python -c "import questionary; print('✓ Questionary imported')"
      
      - name: List test files
        run: |
          echo "Test files found:"
          ls -la tests/
          echo ""
          echo "Test runner exists:"
          ls -la tests/run_all_tests.py
      
      - name: Run tests with Python
        run: |
          cd tests
          python run_all_tests.py
        env:
          PYTHONPATH: ${{ github.workspace }}
