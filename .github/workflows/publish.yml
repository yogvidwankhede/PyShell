name: Build, Test & Publish to PyPI

on:
  push:
    tags:
      - "v*"   # e.g. v1.0.0
  workflow_dispatch:

jobs:
  build-test-publish:
    name: Build, Test, and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Upgrade pip and install build tools
        run: |
          pip install --upgrade pip setuptools wheel build twine

      - name: Install all dependencies
        run: |
          # Install main dependencies first
          pip install psutil rich questionary prompt_toolkit
          # Install testing dependencies
          pip install pytest pytest-asyncio pytest-benchmark pytest-socket
          # Try to install optional dependencies, continue if some fail
          pip install pytest-codspeed pytest-recording syrupy || true

      - name: Run tests
        run: |
          cd tests
          python run_all_tests.py

      - name: Build package
        if: success()
        run: python -m build

      - name: Publish to PyPI
        if: success()
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
